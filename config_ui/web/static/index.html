<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synth Head Config</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/style.css?v=2" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar glass">
        <div class="brand">
          <div class="logo">SH</div>
          <div>
            <h1>Synth Head Config</h1>
            <p>Variation battle station · live sync to Blender</p>
          </div>
        </div>
        <div class="profile-controls">
          <label for="profile-select">Profile</label>
          <select id="profile-select"></select>
          <button id="btn-new" class="btn ghost" type="button">+ New</button>
          <button id="btn-rename" class="btn ghost" type="button">Rename</button>
          <button id="btn-delete" class="btn danger" type="button">Delete</button>
        </div>
        <div class="actions">
          <button id="btn-validate" class="btn ghost" type="button">Validate</button>
          <button id="btn-save" class="btn primary" type="button" disabled>Save changes</button>
        </div>
      </header>

      <div id="new-profile-bar" class="new-bar glass hidden">
        <input id="new-profile-name" class="input" placeholder="Profile name" />
        <span class="hint">duplicates current profile</span>
        <button id="btn-create" class="btn primary" type="button">Create</button>
      </div>

      <div class="workspace">
        <aside class="sidebar glass">
          <p class="sidebar-title">Config files</p>
          <nav id="file-list"></nav>
        </aside>
        <main class="editor-panel">
          <div class="editor-header">
            <div>
              <h2 id="file-title" class="mono">runner.json</h2>
              <p id="file-desc"></p>
            </div>
            <div class="editor-meta">
              <span id="dirty-badge" class="badge hidden">unsaved</span>
              <span id="active-label" class="muted"></span>
            </div>
          </div>
          <div id="form-root" class="form-root"></div>
        </main>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="/assets/app.js?v=2" type="module"></script>
  </body>
</html>
